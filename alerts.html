  <style>
    :root {
      --bg: #0D1117;
      --surface: #161B22;
      --card: #1C2129;
      --border: rgba(139, 148, 158, 0.16);
      --text: #E6EDF3;
      --text-2: #8B949E;
      --text-3: #6E7681;
      --purple: #6C3CE1;
      --blue: #2E75B6;
      --green: #3FB950;
      --gradient: linear-gradient(135deg, #6C3CE1 0%, #2E75B6 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    header { padding: 20px 0 8px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo {
      width: 34px; height: 34px; border-radius: 9px; background: var(--gradient);
      display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 1.1rem;
    }
    .brand-name { font-weight: 700; font-size: 1.1rem; }
    .brand-handle { color: var(--text-2); font-size: 0.9rem; margin-left: auto; text-decoration: none; }

    /* Hero */
    .hero { padding: 36px 0 28px; }
    h1 {
      font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.12; font-weight: 800;
      letter-spacing: -0.02em; text-wrap: balance;
    }
    h1 .grad { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { color: var(--text-2); font-size: 1.05rem; margin-top: 14px; max-width: 34em; }
    .ctas { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 0 20px; border-radius: 12px; text-decoration: none;
      font-weight: 600; font-size: 1rem; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); transition: border-color .15s, transform .15s;
    }
    .btn:hover { border-color: rgba(139,148,158,.4); }
    .btn:active { transform: scale(.99); }
    .btn-primary { background: #fff; color: #0D1117; border-color: #fff; }
    .btn-primary:hover { border-color: #fff; opacity: .92; }
    .btn svg { width: 18px; height: 18px; flex: none; }
    .btn-note { color: var(--text-2); font-size: 0.85rem; text-align: center; margin-top: 6px; }
    .btn-note a { color: #58A6FF; text-decoration: none; }
    .tops { list-style: none; margin-top: 12px; }
    .tops li { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tops .who { font-weight: 600; }
    .tops .why { display: block; color: var(--text-2); font-size: 0.85rem; font-weight: 400; }
    .tops .gain { margin-left: auto; color: var(--green); font-weight: 800; white-space: nowrap; }
    .live {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
      color: var(--text-2); font-size: 0.85rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
    .dot.on { background: var(--green); box-shadow: 0 0 0 4px rgba(63,185,80,.15); }

    /* Sections */
    section { padding: 28px 0; border-top: 1px solid var(--border); }
    h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
    .sub { color: var(--text-2); font-size: 0.95rem; margin-top: 4px; }

    /* Tweet cards */
    .feed { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .tweet {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    .tweet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tweet-head .logo { width: 28px; height: 28px; font-size: .9rem; border-radius: 7px; }
    .tweet-who { font-size: 0.9rem; line-height: 1.25; }
    .tweet-who b { display: block; }
    .tweet-who span { color: var(--text-2); }
    .tag {
      margin-left: auto; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
    }
    .tweet-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.95rem; }
    .tweet-body .ht { color: #58A6FF; }
    .tweet-foot { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-2); }
    .tweet-foot a { color: #58A6FF; text-decoration: none; font-weight: 500; }
    .more { margin-top: 14px; font-size: 0.95rem; }
    .more a { color: #58A6FF; text-decoration: none; font-weight: 500; }

    /* Feature list */
    .features { list-style: none; display: grid; gap: 12px; margin-top: 16px; }
    .features li {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    }
    .features b { display: block; font-size: 0.98rem; }
    .features span { color: var(--text-2); font-size: 0.92rem; }
    @media (min-width: 560px) { .features { grid-template-columns: 1fr 1fr; } }

    /* Tags legend */
    .legend { display: grid; gap: 8px; margin-top: 16px; }
    .legend div {
      display: grid; grid-template-columns: 2rem 1fr; gap: 4px 8px; align-items: baseline;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .legend .ico { font-size: 1.2rem; grid-column: 1; grid-row: 1 / span 2; }
    .legend b { font-size: 0.98rem; grid-column: 2; grid-row: 1; }
    .legend span:not(.ico) { color: var(--text-2); font-size: 0.9rem; grid-column: 2; grid-row: 2; }

    /* FAQ */
    details { border-bottom: 1px solid var(--border); padding: 14px 0; }
    details:first-of-type { margin-top: 8px; }
    summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--text-2); font-weight: 400; font-size: 1.2rem; line-height: 1; }
    details[open] summary::after { content: "−"; }
    details p { color: var(--text-2); margin-top: 8px; font-size: 0.95rem; }

    .h3 { font-size: 1rem; font-weight: 700; margin-top: 24px; }
    .note { color: var(--text-2); font-size: 0.9rem; margin-top: 10px; }
    .cta-end { text-align: center; }
    .cta-end .btn { margin-top: 16px; }
    #alerts { border-top: 0; padding-top: 4px; }
    .how p { color: var(--text-2); font-size: 0.95rem; margin-top: 12px; }
    .how b { color: var(--text); font-weight: 600; }
    footer { border-top: 1px solid var(--border); padding: 24px 0 40px; color: var(--text-3); font-size: 0.85rem; }
    footer nav { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 10px; }
    footer a { color: var(--text-2); text-decoration: none; }
    footer a:hover { color: var(--text); }
    .day { font-size: 0.85rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px; }
    .back { color: var(--text-2); text-decoration: none; font-size: 0.9rem; margin-left: auto; }
    .empty { color: var(--text-2); margin-top: 16px; }
  </style>

<body>
  <div class="wrap">
    <header style="display:flex;align-items:center">
      <a class="brand" href="/" aria-label="Naismith home">
        <div class="logo">N</div>
        <div class="brand-name">Naismith</div>
      </a>

    <main>
      <div class="hero" style="padding-bottom:8px">

      </div>
      <section aria-label="Alerts" style="border-top:0;padding-top:0">
        <div id="list"><p class="empty">Loading alerts…</p></div>
        <button class="btn" id="more" style="width:100%;margin-top:16px;display:none">Show more</button>
      </section>
      <section class="cta-end" aria-label="Follow on X">
        <h2>Get the next one as it breaks.</h2>
        <a class="btn btn-primary" href="https://x.com/NaismithAIApp" target="_blank" rel="noopener">

          Follow Naismith on X
        </a>
      </section>
    </main>

    <footer>

  </div>

  <script src="/feed.js"></script>
  <script>
  (function () {
    var API = 'https://naismith-api-production.up.railway.app';
    var F = window.NaismithFeed, PAGE = 20, shown = 0, cards = [];

    function dayLabel(iso) {
      var d = new Date(iso), today = new Date(), y = new Date();
      y.setDate(today.getDate() - 1);
      if (d.toDateString() === today.toDateString()) return 'Today';
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'});
    }
    function render() {
      shown = Math.min(cards.length, shown + PAGE);
      var html = [], last = null;
      cards.slice(0, shown).forEach(function (c) {
        var day = dayLabel(c.ts);
        if (day !== last) { html.push('<h2 class="day">' + F.esc(day) + '</h2>'); last = day; }
        html.push(c.html);
      });
      document.getElementById('list').innerHTML = '<div class="feed" style="margin-top:0">' + html.join('') + '</div>';
      var more = document.getElementById('more');
      more.style.display = shown < cards.length ? 'flex' : 'none';
      more.textContent = 'Show more (' + (cards.length - shown) + ' left)';
    }
    document.getElementById('more').addEventListener('click', render);

    fetch(API + '/public/alerts?tweeted_only=true&hours=168&limit=200')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        if (data.last_alert_at) {
          document.getElementById('dot').className = 'dot on';
          document.getElementById('updated').textContent = 'Last alert ' + F.ago(data.last_alert_at);
        }
        (data.alerts || []).forEach(function (a) {
          var h = F.alertCard(a);
          if (h) cards.push({ts: a.timestamp, html: h});
        });
        if (!cards.length) { document.getElementById('list').innerHTML = '<p class="empty">No alerts in the last week.</p>'; return; }
        render();
      })
      .catch(function () {
        document.getElementById('list').innerHTML = '<p class="empty">Couldn\'t load alerts. Try again in a minute.</p>';
        document.getElementById('updated').textContent = '';
      });
  })();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
